<!doctype html>
<html lang="en-GB" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Lets CSS hide scroll-reveal elements only when JavaScript runs (no JS = everything visible) -->
    <script>document.documentElement.classList.add('js')</script>
    <meta name="theme-color" content="#034f32" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="Bayana Global Limited" />
    <!-- Local SEO: Addax Tower, Al Reem Island, Abu Dhabi -->
    <meta name="geo.region" content="AE-AZ" />
    <meta name="geo.placename" content="Al Reem Island, Abu Dhabi" />
    <meta name="geo.position" content="24.4960512;54.4088597" />
    <meta name="ICBM" content="24.4960512, 54.4088597" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Google Analytics 4: paste your gtag snippet here (see README) -->
    <!-- Loading screen (same as the old bayana.ae): animated Bayana logo video + 3 bouncing dots.
         Shown every time the site is opened or refreshed, for about 3 seconds. -->
    <link rel="preload" href="/load-poster.webp" as="image" />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .8s cubic-bezier(.25,.46,.45,.94),visibility .8s}
      #splash.sp-hide{opacity:0;visibility:hidden;pointer-events:none}
      #splash .sp-in{display:flex;flex-direction:column;align-items:center;width:100%}
      #splash video{display:block;width:100%;max-width:400px;height:auto;aspect-ratio:4/3;object-fit:cover;background:#fff}
      #splash .sp-dots{display:flex;gap:8px;margin-top:1.5rem}
      #splash .sp-dots i{display:block;width:8px;height:8px;border-radius:50%;background:#16a34a;animation:spDot 1.4s ease-in-out infinite both}
      #splash .sp-dots i:nth-child(1){animation-delay:-.32s}
      #splash .sp-dots i:nth-child(2){animation-delay:-.16s}
      @keyframes spDot{0%,80%,100%{transform:scale(0);opacity:.5}40%{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){#splash .sp-dots i{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-in">
        <video src="/load.mp4" poster="/load-poster.webp" autoplay loop muted playsinline preload="auto" width="640" height="480"></video>
        <div class="sp-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var SHOW_AFTER_LOAD = 3100 // like the old site: hide 3.1 s after the page has loaded
        var MAX = 5000 // never longer than 5 s, even on slow connections
        var s = document.getElementById('splash'), done = false
        if (location.pathname.indexOf('/admin') === 0) { s.parentNode.removeChild(s); return }
        function hide() {
          if (done) return; done = true
          s.className = 'sp-hide'
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s) }, 800)
        }
        window.addEventListener('load', function () { setTimeout(hide, SHOW_AFTER_LOAD) })
        setTimeout(hide, MAX)
        // Visitors can skip it: any click, scroll or key press hides it straight away
        ;['click', 'wheel', 'touchstart', 'keydown'].forEach(function (e) { document.addEventListener(e, hide, { once: true, passive: true }) })
      })()
    </script>
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-brand-900 focus:px-5 focus:py-3 focus:text-white">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
