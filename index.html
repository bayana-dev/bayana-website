<!doctype html>
<html lang="en-GB" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Lets CSS hide scroll-reveal elements only when JavaScript runs (no JS = everything visible) -->
    <script>document.documentElement.classList.add('js')</script>
    <meta name="theme-color" content="#034f32" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="Bayana Global Limited" />
    <!-- Local SEO: Addax Tower, Al Reem Island, Abu Dhabi -->
    <meta name="geo.region" content="AE-AZ" />
    <meta name="geo.placename" content="Al Reem Island, Abu Dhabi" />
    <meta name="geo.position" content="24.4966;54.4063" />
    <meta name="ICBM" content="24.4966, 54.4063" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Google Analytics 4: paste your gtag snippet here (see README) -->
    <!-- Loading screen: Bayana logo + 3 bouncing dots. Shown once per visit for ~2.5 seconds -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .6s ease,visibility .6s ease}
      #splash.sp-hide{opacity:0;visibility:hidden}
      #splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:34px}
      #splash .sp-logo{width:240px;max-width:64vw;height:auto;animation:spUp .9s cubic-bezier(.2,.7,.2,1) both,spBreath 2.6s ease-in-out .9s infinite}
      #splash .sp-dots{display:flex;gap:9px;animation:spFade .6s ease .5s both}
      #splash .sp-dots i{display:block;width:9px;height:9px;border-radius:50%;background:#16a34a;animation:spDot 1.2s ease-in-out infinite}
      #splash .sp-dots i:nth-child(2){animation-delay:.18s}
      #splash .sp-dots i:nth-child(3){animation-delay:.36s}
      @keyframes spUp{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
      @keyframes spBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
      @keyframes spFade{from{opacity:0}to{opacity:1}}
      @keyframes spDot{0%,80%,100%{transform:scale(.35);opacity:.35}40%{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-in">
        <img class="sp-logo" src="/bayana-logo-stacked.png" alt="" width="267" height="209" />
        <div class="sp-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var MIN = 2500 // shown at least 2.5 seconds
        var MAX = 4000 // never longer than 4 seconds, even on slow connections
        var s = document.getElementById('splash'), done = false, t0 = Date.now()
        var skip = location.pathname.indexOf('/admin') === 0
        try { if (sessionStorage.getItem('bayana-splash')) skip = true; else sessionStorage.setItem('bayana-splash', '1') } catch (e) {}
        if (skip) { s.parentNode.removeChild(s); return }
        function hide() {
          if (done) return; done = true
          setTimeout(function () {
            s.className = 'sp-hide'
            setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s) }, 600)
          }, Math.max(0, MIN - (Date.now() - t0)))
        }
        if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide)
        setTimeout(hide, MAX)
      })()
    </script>
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-brand-900 focus:px-5 focus:py-3 focus:text-white">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
