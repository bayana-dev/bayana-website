<!doctype html>
<html lang="en-GB" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Lets CSS hide scroll-reveal elements only when JavaScript runs (no JS = everything visible) -->
    <script>document.documentElement.classList.add('js')</script>
    <meta name="theme-color" content="#034f32" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="Bayana Global Limited" />
    <!-- Local SEO: Addax Tower, Al Reem Island, Abu Dhabi -->
    <meta name="geo.region" content="AE-AZ" />
    <meta name="geo.placename" content="Al Reem Island, Abu Dhabi" />
    <meta name="geo.position" content="24.4966;54.4063" />
    <meta name="ICBM" content="24.4966, 54.4063" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Google Analytics 4: paste your gtag snippet here (see README) -->
    <!-- Loading screen (Bayana logo + progress bar). Shown once per visit, gone within ~1 second -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .5s ease,visibility .5s ease}
      #splash.sp-hide{opacity:0;visibility:hidden}
      #splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:22px;animation:spUp .7s cubic-bezier(.2,.7,.2,1) both}
      #splash .sp-logo{position:relative;padding:18px 26px}
      #splash .sp-logo img{display:block;width:230px;max-width:62vw;height:auto}
      #splash .sp-logo::after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);background-size:250% 100%;animation:spShine 1.4s ease-in-out infinite}
      #splash .sp-bar{width:180px;height:3px;border-radius:9px;background:#dcfce7;overflow:hidden}
      #splash .sp-bar span{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#16a34a,#034f32);animation:spLoad 1.1s ease-in-out infinite}
      @keyframes spUp{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
      @keyframes spShine{from{background-position:150% 0}to{background-position:-50% 0}}
      @keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-in">
        <div class="sp-logo"><img src="/logo.png" alt="" width="290" height="64" /></div>
        <div class="sp-bar"><span></span></div>
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('splash'), done = false, t0 = Date.now()
        var skip = location.pathname.indexOf('/admin') === 0
        try { if (sessionStorage.getItem('bayana-splash')) skip = true; else sessionStorage.setItem('bayana-splash', '1') } catch (e) {}
        if (skip) { s.parentNode.removeChild(s); return }
        function hide() {
          if (done) return; done = true
          setTimeout(function () {
            s.className = 'sp-hide'
            setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s) }, 600)
          }, Math.max(0, 900 - (Date.now() - t0))) // shown at least 0.9 s so the animation is seen
        }
        if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide)
        setTimeout(hide, 2500) // never longer than 2.5 s, even on slow connections
      })()
    </script>
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-brand-900 focus:px-5 focus:py-3 focus:text-white">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
